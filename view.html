<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema_CPE</title>
    <!-- X-Marçal — github.com/cirleno -->
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link href="css/bootstrap.css" rel="stylesheet">
    <link rel="stylesheet" href="css/font-awesome.css">
    <style>
      body { padding-top: 52px; }
      .navbar { min-height: 35px; padding-top: 2px; padding-bottom: 2px; }
      .navbar-brand { padding-top: 0; padding-bottom: 0; font-size: 1.125rem; }
      .navbar-toggler { padding: 3px 6px; }
    </style>
  </head>

  <body>
    <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalLabel">Excluir Item</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            Deseja realmente excluir este item?
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" id="btn-confirmar-exclusao">Sim</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">N&atilde;o</button>
          </div>
        </div>
      </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container position-relative">
        <a class="navbar-brand" href="add.html">
          <img src="img/x-mar%C3%A7al_Logo.png" alt="Logotipo" style="height: 38px; width: auto;">
        </a>
        <span class="position-absolute top-50 start-50 translate-middle text-white fw-semibold">Cadastro, Edição e Pesquisa</span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Alternar navegação">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navbar" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="add.html">Cadastro</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html">Pesquisa</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div id="main" class="container">
      <h3 class="mb-4">Visualizar Alunos Cadastrados!</h3>

      <div class="row">
        <div class="col-md-4 mb-3">
          <p class="fw-bold mb-1">Nome Completo</p>
          <p id="detalhe-nome" class="mb-0"></p>
        </div>
        <div class="col-md-4 mb-3">
          <p class="fw-bold mb-1">Curso</p>
          <p id="detalhe-curso" class="mb-0"></p>
        </div>
        <div class="col-md-4 mb-3">
          <p class="fw-bold mb-1">Data Início</p>
          <p id="detalhe-data" class="mb-0"></p>
        </div>
      </div>

      <hr />

      <div class="d-flex flex-wrap gap-2">
        <a href="index.html" class="btn btn-secondary">Fechar</a>
        <a href="#" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#delete-modal">Excluir</a>
      </div>
    </div>

    <div class="container py-3">
      <hr />
      <div class="d-flex justify-content-center">
        <footer class="text-muted">
          <p class="mb-0 d-inline-flex align-items-center flex-wrap justify-content-center">Copyright &copy; 2016 by
            <img src="img/x-mar%C3%A7al_Logo_original.png" alt="X-Marçal" style="height: 34px; width: auto;" class="ms-2">
            <a href="https://github.com/cirleno?tab=repositories" target="_blank" rel="noopener" aria-label="GitHub" style="color: #181717;">
              <span class="fab fa-github fa-lg ms-3" aria-hidden="true"></span>
            </a>
          </p>
        </footer>
      </div>
    </div>

    <script src="js/bootstrap.js"></script>
    <script src="js/sistema.js"></script>
    <script>
      (function () {
        var idAtual = null;

        Sistema.DataStore.load().then(function () {
          var id = Number(Sistema.obterParametro('id'));
          var aluno = Sistema.DataStore.findById(id);
          if (!aluno) {
            window.location.href = 'index.html';
            return;
          }
          idAtual = id;
          document.getElementById('detalhe-nome').textContent = aluno.nome;
          document.getElementById('detalhe-curso').textContent = aluno.curso;
          document.getElementById('detalhe-data').textContent = aluno.dataInicio;
          document.getElementById('btn-editar-detalhe').href = 'edit.html?id=' + id;
        });

        document.getElementById('btn-confirmar-exclusao').addEventListener('click', function () {
          if (idAtual) {
            Sistema.DataStore.remove(idAtual);
          }
          bootstrap.Modal.getOrCreateInstance(document.getElementById('delete-modal')).hide();
          window.location.href = 'index.html';
        });
      })();
    </script>
  </body>
</html>
